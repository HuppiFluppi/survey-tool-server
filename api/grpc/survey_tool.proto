// ---------------------------------------------------------------------------
// Survey Tool Api gRPC specification
//
// Used for communication btw. clients (survey-tool & survey-tool-cli) and
// server (survey-tool-server)
// ---------------------------------------------------------------------------

syntax = "proto3";

package survey.v1;

option java_package = "com.zinkel.surveyTool.grpc.v1";

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

enum SurveyType {
  SURVEY_TYPE_UNSPECIFIED = 0;
  SURVEY_TYPE_SURVEY = 1;
  SURVEY_TYPE_QUIZ = 2;
}

message SurveySummary {
  // id of the survey. unique and specific for this server
  string id = 1;
  // title of the survey. mandatory
  string title = 2;
  // description of the survey. mandatory
  string description = 3;
  // type of the survey. mandatory
  SurveyType survey_type = 4;
  // activation state. Inactive surveys cannot have new results. mandatory
  bool active = 5;
  // total pages in survey. mandatory
  uint32 page_count = 6;
  // total questions in survey. mandatory
  uint32 question_count = 7;
  // number of submits. mandatory
  uint32 submit_count = 8;
  // whether the survey has conditional elements. mandatory
  bool conditionals = 9;
  // when the first submit for the survey was. only set if the survey was answered. format RFC 3339: {year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z
  google.protobuf.Timestamp first_submit_time = 10;
  // most recent submit for the survey. only set if the survey was answered. format RFC 3339: {year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z
  google.protobuf.Timestamp last_submit_time = 11;
  // min score achieved. only available if survey type is quiz
  optional int32 min_score = 12;
  // min score achieved. only available if survey type is quiz
  optional int32 max_score = 13;
  // min score achieved. only available if survey type is quiz
  optional float avg_score = 14;
}

// ---------------------------------------------------------------------------
// SurveyService  (mirrors /v1/survey and /v1/survey/{id})
// ---------------------------------------------------------------------------

service SurveyService {
  // Returns a list of all surveys, optionally filtered by the given parameters
  // GET    /v1/survey          → gRPC: INVALID_ARGUMENT, UNAUTHENTICATED, PERMISSION_DENIED, INTERNAL
  rpc ListSurveys(ListSurveysRequest) returns (ListSurveysResponse);

  // Create survey
  // POST   /v1/survey          → gRPC: INVALID_ARGUMENT, UNAUTHENTICATED, PERMISSION_DENIED, INTERNAL
  rpc CreateSurvey(CreateSurveyRequest) returns (CreateSurveyResponse);

  // Get the survey with the given id
  // GET    /v1/survey/{id}     → gRPC: INVALID_ARGUMENT, UNAUTHENTICATED, PERMISSION_DENIED, NOT_FOUND, INTERNAL
  rpc GetSurvey(GetSurveyRequest) returns (GetSurveyResponse);

  // Delete the survey with the given id
  // DELETE /v1/survey/{id}     → gRPC: INVALID_ARGUMENT, UNAUTHENTICATED, PERMISSION_DENIED, NOT_FOUND, INTERNAL
  rpc DeleteSurvey(DeleteSurveyRequest) returns (DeleteSurveyResponse);

  // Set survey (in)-active
  // PUT    /v1/survey/{id}/active/{set}
  rpc SetSurveyActive(SetSurveyActiveRequest) returns (SetSurveyActiveResponse);
}

message ListSurveysRequest {
  // optional filter for survey type
  optional SurveyType type = 1;
  // optional filter for active status
  optional bool active = 2;
}

message ListSurveysResponse {
  repeated SurveySummary surveys = 1;
}

message CreateSurveyRequest {
  bytes zip_content = 1; // zip file contents. expect config file named 'survey_config.yaml' in root of zip. mandatory
}

message CreateSurveyResponse {
  string survey_id = 1; // UUID of the created survey
}

message GetSurveyRequest {
  string survey_id = 1; // UUID of the survey. mandatory
}

message GetSurveyResponse {
  bytes zip_content = 1; // zip file contents
}

message DeleteSurveyRequest {
  string survey_id = 1; // UUID of the survey. mandatory
}

message DeleteSurveyResponse {}

message SetSurveyActiveRequest {
  string survey_id = 1; // UUID of the survey. mandatory
  bool active = 2; //state for the survey. mandatory
}

message SetSurveyActiveResponse {}

// ---------------------------------------------------------------------------
// SurveyResultsService  (mirrors /v1/survey/{id}/results)
// ---------------------------------------------------------------------------

service SurveyResultsService {
  // Get the results of the survey with the given id
  // GET    /v1/survey/{id}/results
  rpc GetResults(GetResultsRequest) returns (GetResultsResponse);

  // Add a new result to the survey with the given id
  // POST   /v1/survey/{id}/results
  rpc AddResult(AddResultRequest) returns (AddResultResponse);

  // Delete all results of the survey with the given id
  // DELETE /v1/survey/{id}/results
  rpc DeleteResults(DeleteResultsRequest) returns (DeleteResultsResponse);
}

message GetResultsRequest {
  string survey_id = 1; // UUID of the survey. mandatory
}

message GetResultsResponse {
  repeated SurveyResult results = 1;
}

message AddResultRequest {
  string survey_id = 1; // UUID of the survey. mandatory
  SurveyResult result = 2; // mandatory
}

message AddResultResponse {}

message DeleteResultsRequest {
  string survey_id = 1; // UUID of the survey. mandatory
}

message DeleteResultsResponse {}

enum QuestionType {
  QUESTION_TYPE_UNSPECIFIED = 0;
  QUESTION_TYPE_DATA = 1;
  QUESTION_TYPE_CHOICE = 2;
  QUESTION_TYPE_TEXT = 3;
  QUESTION_TYPE_RATING = 4;
  QUESTION_TYPE_LIKERT = 5;
  QUESTION_TYPE_DATETIME = 6;
  QUESTION_TYPE_SLIDER = 7;
}

// Represents the answer to a single question.
// Exactly one of the answer fields should be set.
message QuestionAnswer {
  string question_id = 1; // question id. mandatory
  string question_title = 2; // question title. mandatory
  QuestionType question_type = 3; // question type. mandatory
  bool is_answered = 4; // question answered. mandatory

  oneof answer {// mandatory if question answered
    string string_answer = 5;
    int32 int_answer = 6;
    StringList list_answer = 7;
    StringMap map_answer = 8;
    RangeAnswer range_answer = 9;
  }
}

message StringList {
  repeated string values = 1;
}

message StringMap {
  map<string, string> entries = 1;
}

message RangeAnswer {
  float first = 1;
  optional float second = 2;
}

message SurveyResult {
  string origin = 1; // origin. typically an identifier of the client. mandatory
  google.protobuf.Timestamp start_time = 2; // when the user started the survey. mandatory. format RFC 3339: {year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z
  google.protobuf.Timestamp end_time = 3; // when the user end the survey. mandatory. format RFC 3339: {year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z
  optional string user = 4; // needed for survey type quiz
  optional int32 score = 5; // needed for survey type quiz
  uint32 answered_pages = 6; // how many pages the user answered. mandatory
  uint32 answered_questions = 7; // how many questions the user answered. mandatory
  repeated QuestionAnswer answers = 8; //answers
}

// ---------------------------------------------------------------------------
// SurveyDataService  (mirrors /v1/survey/{id}/summary and /highscore)
// ---------------------------------------------------------------------------

service SurveyDataService {
  // Get survey summary
  // GET /v1/survey/{id}/summary
  rpc GetSurveySummary(GetSurveySummaryRequest) returns (GetSurveySummaryResponse);

  // Get survey highscore
  // GET /v1/survey/{id}/highscore
  rpc GetHighscore(GetHighscoreRequest) returns (GetHighscoreResponse);
}

message GetSurveySummaryRequest {
  string survey_id = 1; // UUID of the survey. mandatory
}

message GetSurveySummaryResponse {
  SurveySummary summary = 1;
}

message GetHighscoreRequest {
  string survey_id = 1; // UUID of the survey. mandatory
  optional uint32 limit = 2; // return limit. default 10
}

message GetHighscoreResponse {
  repeated HighscoreEntry entries = 1;
}

message HighscoreEntry {
  string name = 1; // name of the participant
  int32 score = 2; // score of the participant
  google.protobuf.Timestamp time = 3; // time of the survey run. format RFC 3339: {year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z
}

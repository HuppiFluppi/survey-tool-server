[workspace]
members = ["client", "server", "test"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Felix Zinkel"]
license = "MIT"

[workspace.dependencies]
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-native-roots"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
base64 = "0.23.0"

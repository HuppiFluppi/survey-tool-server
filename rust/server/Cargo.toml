[package]
name = "survey-tool-server"
description = "Server to distribute and handle survey tool configuration and data"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["grpc", "local"]
grpc = []
rest = []
aws = ["dep:aws-config", "dep:aws-sdk-s3files", "dep:aws-sdk-dynamodb"]
local = ["dep:rusqlite"]

[dependencies]
tonic = { workspace = true, features = ["server", "router"] }
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
clap = { version = "4.6.1", features = ["derive", "env", "cargo"] }
strum = { version = "0.28.0", features = ["derive"] }
aws-config = { version = "1.1.7", features = ["behavior-version-latest"], optional = true }
aws-sdk-s3files = { version = "1.7.0", optional = true }
aws-sdk-dynamodb = { version = "1.117.0", optional = true }
rusqlite = { version = "0.40.1", optional = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
